<!DOCTYPE html>
<html lang="uk" class="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <title>Пошук відповідей — мобільний режим</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22> >_ </text></svg>">
    <link rel="stylesheet" href="css/poshuk.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <script src="js/animations.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="topbar-inner">
            <h1 class="sr-only">Пошук відповіді на тест</h1>
            <div class="bar">
                <a class="icon-btn back" href="index.html" aria-label="На головну">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
                </a>
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
                    <input id="search" class="search-input" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Введи запитання…" aria-label="Пошук запитання" />
                    <button id="clear" class="clear-btn" aria-label="Очистити">&times;</button>
                </div>
                <button id="topics-btn" class="topics-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="sheet">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
                    <span>Теми</span>
                </button>
            </div>
            <div class="filter-row" id="filter-row">
                <div class="filter-inner">
                    <button id="filter-pill" class="filter-pill" type="button" aria-label="Скинути тему">
                        <span class="filter-label">Тема:</span>
                        <span class="filter-name" id="filter-name"></span>
                        <span class="filter-x" aria-hidden="true">&times;</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    <main class="wrap">
        <p class="meta" id="meta"></p>
        <div class="results" id="results"></div>
    </main>
    <!-- Вибір теми: нижня панель (на телефоні) / вікно по центру (на ПК) -->
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-drag">
            <div class="sheet-grab" aria-hidden="true"></div>
            <div class="sheet-head">
                <h2 id="sheet-title">Оберіть тему</h2>
                <button id="sheet-close" class="icon-btn small" type="button" aria-label="Закрити">&times;</button>
            </div>
        </div>
        <p class="sheet-sub">Пошук буде лише в обраній темі.</p>
        <div class="sheet-list" id="chips"></div>
    </section>
    <!--
    База відповідей винесена в data/answers-db.js — це окрема "база знань"
    цієї сторінки (не перетинається з базою на index.html).
  -->
    <script src="data/answers-db.js"></script>
    <script src="js/search.js"></script>
</body>

</html>

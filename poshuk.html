<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12161f" />
  <title>Пошук відповідей — мобільний режим</title>
  <link rel="stylesheet" href="css/poshuk.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="row">
        <a class="back" href="index.html">&larr; На головну</a>
      </div>
      <h1>Пошук відповіді на тест</h1>
      <div class="search-box">
        <input
          id="search"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Введи запитання або кілька слів з нього…"
          aria-label="Пошук запитання"
        />
        <button id="clear" class="clear-btn" aria-label="Очистити">&times;</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <main class="wrap">
    <p class="meta" id="meta"></p>
    <div class="results" id="results"></div>
  </main>

  <!--
    База відповідей винесена в data/answers-db.js — це окрема "база знань"
    цієї сторінки (не перетинається з базою на index.html).
  -->
  <script src="data/answers-db.js"></script>
  <script src="js/search.js"></script>
</body>
</html>

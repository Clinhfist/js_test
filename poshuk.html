<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#12161f" />
  <title>Пошук відповідей — мобільний режим</title>
  <style>
    :root {
      --bg: #12161f;
      --card: #1b212e;
      --card-2: #212938;
      --border: rgba(255, 255, 255, 0.10);
      --text: #e7ebf3;
      --muted: #9aa4b8;
      --accent: #34d17e;
      --accent-ink: #0c1a12;
      --tag: #2a3446;
      --radius: 14px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding: 0 0 env(safe-area-inset-bottom);
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }

    /* Sticky search header */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(18, 22, 31, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding-top: env(safe-area-inset-top);
    }

    .topbar-inner { max-width: 640px; margin: 0 auto; padding: 12px 16px; }

    .row { display: flex; align-items: center; gap: 10px; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none;
      font-size: 14px; font-weight: 600;
      padding: 6px 4px;
    }
    .back:active { color: var(--text); }

    h1 { font-size: 18px; margin: 4px 0 12px; font-weight: 700; }

    .search-box { position: relative; }

    .search-input {
      width: 100%;
      font-size: 17px; /* >=16px, щоб iOS не зумив */
      padding: 14px 44px 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(52, 209, 126, 0.18);
    }

    .clear-btn {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: var(--tag); color: var(--muted);
      font-size: 18px; line-height: 1; cursor: pointer;
      display: none; align-items: center; justify-content: center;
    }
    .clear-btn.show { display: flex; }

    .meta { color: var(--muted); font-size: 13px; margin: 10px 2px 4px; }

    /* Category filter chips */
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin: 0 -2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      font-size: 13px; font-weight: 600;
      padding: 7px 12px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--muted); cursor: pointer; white-space: nowrap;
    }
    .chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    /* Result cards */
    .results { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .card-cat {
      display: inline-block;
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      color: var(--accent);
      background: rgba(52, 209, 126, 0.12);
      border: 1px solid rgba(52, 209, 126, 0.28);
      padding: 3px 8px; border-radius: 999px;
      margin-bottom: 10px;
    }

    .q { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
    .q b { color: var(--text); font-weight: 600; }

    .a-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }

    .a {
      font-size: 16px; font-weight: 600; color: var(--text);
      background: var(--card-2);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      word-break: break-word;
    }

    .copy {
      margin-top: 10px;
      width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px; font-weight: 700;
      padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--tag); color: var(--text);
      cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .copy:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .copy.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

    mark { background: rgba(52, 209, 126, 0.30); color: inherit; border-radius: 3px; padding: 0 1px; }

    .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
    .empty .big { font-size: 15px; color: var(--text); margin-bottom: 6px; }

    .hint {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; color: var(--muted); font-size: 14px; margin-top: 14px;
    }
    .hint b { color: var(--text); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="row">
        <a class="back" href="index.html">&larr; На головну</a>
      </div>
      <h1>Пошук відповіді на тест</h1>
      <div class="search-box">
        <input
          id="search"
          class="search-input"
          type="search"
          inputmode="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Введи запитання або кілька слів з нього…"
          aria-label="Пошук запитання"
        />
        <button id="clear" class="clear-btn" aria-label="Очистити">&times;</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <main class="wrap">
    <p class="meta" id="meta"></p>
    <div class="results" id="results"></div>
  </main>

  <!-- ================= БАЗА ВІДПОВІДЕЙ ================= -->

          .toLowerCase()
          .replace(/[’'`]/g, "'")
          .replace(/[«»"“”]/g, "")
          .replace(/[^a-zа-яіїєґ0-9'\s]/gi, " ")

      function tokens(s) {
        return norm(s).split(" ").filter(t => t.length >= 2);
      }

      function score(entry, qNorm, qTokens) {
        if (!qNorm) return 0;
        let s = 0;
        const hay = entry._q || entry._a;

        // Пряме входження всього рядка запиту в запитання
        if (entry._q && entry._q.includes(qNorm)) s += 50;
        if (entry._a.includes(qNorm)) s += 20;

        // Перекриття по словах із запитанням
        qTokens.forEach(t => {
          if (entry._q && entry._q.includes(t)) s += 6;
          else if (entry._a.includes(t)) s += 2;
        });

        // Бонус за частку співпадінь слів запитання
        if (entry._qt.length) {
          const matched = entry._qt.filter(t => qTokens.some(x => x.includes(t) || t.includes(x))).length;
          s += Math.round((matched / entry._qt.length) * 10);
        }
        return s;
      }

      function escapeHtml(s) {
        return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      }

      function highlight(text, qTokens) {
        let out = escapeHtml(text);
        if (!qTokens.length) return out;
        // підсвічуємо унікальні токени
        const uniq = Array.from(new Set(qTokens)).filter(t => t.length >= 3).sort((a, b) => b.length - a.length);
        uniq.forEach(t => {
          const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
          out = out.replace(re, "<mark>$1</mark>");
        });
        return out;
      }

      function copyText(text, btn) {
        const done = () => {
          btn.classList.add("done");
          const old = btn.dataset.label;
          btn.textContent = "Скопійовано ✓";
          setTimeout(() => { btn.classList.remove("done"); btn.textContent = old; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
        } else {
          fallback(text, done);
        }
      }
      function fallback(text, done) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) {}
        document.body.removeChild(ta);
      }

      function render(query) {
        const qNorm = norm(query);
        const qTokens = tokens(query);
        clearEl.classList.toggle("show", !!query);

        let pool = ENTRIES;
        if (activeCat !== "Всі") pool = pool.filter(e => e.cat === activeCat);

        let list;
        if (!qNorm) {
          // без запиту показуємо перші записи категорії
          list = pool.slice(0, 30);
          metaEl.textContent = activeCat === "Всі"
            ? "Усього відповідей: " + ENTRIES.length + ". Почни вводити запитання."
            : pool.length + " відповідей у категорії. Почни вводити запитання.";
        } else {
          list = pool
            .map(e => ({ e, s: score(e, qNorm, qTokens) }))
            .filter(x => x.s > 0)
            .sort((a, b) => b.s - a.s)
            .slice(0, 20)
            .map(x => x.e);
          metaEl.textContent = list.length
            ? "Знайдено збігів: " + list.length + (list.length === 20 ? "+" : "")
            : "";
        }

        if (!list.length) {
          resultsEl.innerHTML = "";
          const div = document.createElement("div");
          div.className = "empty";
          div.innerHTML = qNorm
            ? '<div class="big">Нічого не знайдено</div><div>Спробуй ввести інші слова із запитання або менше слів.</div>'
            : '<div class="big">Почни вводити запитання</div>';
          resultsEl.appendChild(div);
          return;
        }

        resultsEl.innerHTML = "";
        list.forEach(e => {
          const card = document.createElement("div");
          card.className = "card";

          const cat = document.createElement("span");
          cat.className = "card-cat";
          cat.textContent = e.cat;
          card.appendChild(cat);

          if (e.q) {
            const q = document.createElement("p");
            q.className = "q";
            q.innerHTML = "<b>Питання:</b> " + highlight(e.q, qTokens);
            card.appendChild(q);
          }

          const al = document.createElement("div");
          al.className = "a-label";
          al.textContent = e.q ? "Відповідь" : "Правильний варіант";
          card.appendChild(al);

          const a = document.createElement("div");
          a.className = "a";
          a.innerHTML = highlight(e.a, qTokens);
          card.appendChild(a);

          const btn = document.createElement("button");
          btn.className = "copy";
          //btn.dataset.label = "Копіювати відповідь";
          //btn.textContent = "Копіювати відповідь";
          //btn.addEventListener("click", () => copyText(e.a, btn));
          //card.appendChild(btn);

          resultsEl.appendChild(card);
        });
      }

      // debounce
      let t;
      searchEl.addEventListener("input", () => {
        clearTimeout(t);
        t = setTimeout(() => render(searchEl.value), 120);
      });
      clearEl.addEventListener("click", () => {
        searchEl.value = "";
        searchEl.focus();
        render("");
      });

      render("");
    })();
  </script>
</body>
</html>
